<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">moses0100 — commit ก่อน เดี๋ยวค่อยเข้าใจ</title>
<desc id="desc">ชื่อเด้งทีละตัว ข้อความพิมพ์สลับมุก และแมวตัวอักษรวิ่งพร้อมข้อความ อย่าเผลอ push .env ล่ะ</desc>
<style>
text{font-family:Tahoma,'Noto Sans Thai',sans-serif;fill:#24292f}.name text{font-family:Consolas,monospace;font-size:64px;font-weight:700}.letter{animation:bounce 2.5s ease-in-out infinite}.phrase{opacity:0;animation:phrase 24s linear infinite}.typed{clip-path:inset(0 100% 0 0);animation:typing 24s steps(28,end) infinite}.cursor{animation:blink 1s step-end infinite}.cat{animation:run 12s linear infinite}.cat text{font-family:Consolas,monospace;font-size:18px}.typing text{fill:#0969da;font-size:24px}.speech{fill:#586069;font-size:15px}
@keyframes bounce{0%,20%,100%{transform:translateY(0)}8%{transform:translateY(-14px)}14%{transform:translateY(3px)}}
@keyframes phrase{0%,24.9%{opacity:1}25%,100%{opacity:0}}
@keyframes typing{0%{clip-path:inset(0 100% 0 0)}9%,19%{clip-path:inset(0 0 0 0)}24%,100%{clip-path:inset(0 100% 0 0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes run{from{transform:translateX(-180px)}to{transform:translateX(950px)}}

</style>
<rect width="900" height="350" fill="#ffffff"/>
<text x="30" y="34" style="fill:#586069;font-size:17px">// เข้ามาแล้วอย่าเพิ่งกดออก</text>
<g class="name"><g class="letter" style="animation-delay:0.00s"><text x="30" y="125">m</text></g><g class="letter" style="animation-delay:0.11s"><text x="75" y="125">o</text></g><g class="letter" style="animation-delay:0.22s"><text x="120" y="125">s</text></g><g class="letter" style="animation-delay:0.33s"><text x="165" y="125">e</text></g><g class="letter" style="animation-delay:0.44s"><text x="210" y="125">s</text></g><g class="letter" style="animation-delay:0.55s"><text x="255" y="125">0</text></g><g class="letter" style="animation-delay:0.66s"><text x="300" y="125">1</text></g><g class="letter" style="animation-delay:0.77s"><text x="345" y="125">0</text></g><g class="letter" style="animation-delay:0.88s"><text x="390" y="125">0</text></g><text x="440" y="125" class="cursor" style="fill:#0969da">_</text></g>
<g class="typing"><g class="phrase" style="animation-delay:0s"><text x="30" y="183" class="typed" style="animation-delay:0s">commit ก่อน เดี๋ยวค่อยเข้าใจ</text></g><g class="phrase" style="animation-delay:6s"><text x="30" y="183" class="typed" style="animation-delay:6s">แก้บั๊ก 1 ตัว ได้เพิ่มมาอีก 3</text></g><g class="phrase" style="animation-delay:12s"><text x="30" y="183" class="typed" style="animation-delay:12s">มันรันได้ แต่ยังไม่กล้าแตะ</text></g><g class="phrase" style="animation-delay:18s"><text x="30" y="183" class="typed" style="animation-delay:18s">README ดูดีแล้ว เหลือโค้ด</text></g></g>
<g class="cat"><text x="0" y="276" xml:space="preserve"> /\_/\</text><text x="0" y="296" xml:space="preserve">( o.o )</text><text x="0" y="316" xml:space="preserve"> &gt; ^ &lt;</text><text x="0" y="247" class="speech" style="font-family:Tahoma,sans-serif;font-size:15px;fill:#586069">อย่าเผลอ push .env ล่ะ</text></g>
<path d="M30 338H870" stroke="#d0d7de" stroke-dasharray="4 5"/>
</svg>
